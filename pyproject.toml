[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-brasil"
version = "0.2.0"
description = "Tipos de dados e validadores brasileiros de alta performance para Pydantic v2 e FastAPI (CPF, CNPJ 2026, CEP, Chave PIX, Telefone, CNH, PIS, SUS, Título de Eleitor, Processo CNJ e mais)"
readme = "README.md"
authors = [
    { name = "Luan Schons", email = "luanschons2000@gmail.com" }
]
license = "MIT"
keywords = [
    "pydantic",
    "pydantic-v2",
    "brasil",
    "brazil",
    "cpf",
    "cnpj",
    "cep",
    "pix",
    "chave-pix",
    "telefone",
    "pis",
    "pasep",
    "sus",
    "cns",
    "titulo-eleitor",
    "processo-cnj",
    "certidao",
    "banco",
    "cnh",
    "renavam",
    "placa",
    "mercosul",
    "fastapi",
    "validacao",
    "validation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Luan1Schons/pydantic-brasil"
Repository = "https://github.com/Luan1Schons/pydantic-brasil"
Issues = "https://github.com/Luan1Schons/pydantic-brasil/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pydantic_brasil*"]

[tool.setuptools.package-data]
pydantic_brasil = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=pydantic_brasil --cov-report=term-missing"
